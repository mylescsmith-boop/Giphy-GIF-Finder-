<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giphy GIF Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body>
    <main class="container py-5">
      <h1 class="text-center mb-2">Giphy GIF Finder</h1>
      <p class="text-center text-muted mb-4">Search for GIFs and find one that fits your mood.</p>

      <form id="search-form" class="row justify-content-center g-2 mb-4">
        <div class="col-12 col-md-7">
          <label for="search-input" class="visually-hidden">Search for a GIF</label>
          <input type="text" id="search-input" class="form-control form-control-lg" placeholder="Search for a GIF..." value="basketball" />
        </div>
        <div class="col-12 col-md-auto">
          <button id="fetch-gif-btn" class="btn btn-primary btn-lg w-100" type="submit">Search GIFs</button>
        </div>
      </form>

      <p id="status" class="text-center" role="status">Enter a search and press Search GIFs.</p>
      <div id="gif-container" class="row g-3" aria-live="polite">
        <!-- GIF results appear here -->
      </div>
    </main>
    <script src="./js/script.js"></script>
  </body>
</html>
